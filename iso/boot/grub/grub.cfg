set timeout=30

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Try or Install Hana Remix" {
	set gfxpayload=keep
	linux	/casper/vmlinuz locale=ja_JP.UTF-8 --- quiet splash
	initrd	/casper/initrd
}
menuentry "Try or Install Hana Remix (English)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz locale=en_US.UTF-8 --- quiet splash
	initrd	/casper/initrd
}
menuentry "Hana Remix (safe graphics)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz nomodeset locale=ja_JP.UTF-8 --- quiet splash
	initrd	/casper/initrd
}
grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry 'Boot from next volume' {
	exit 1
}
menuentry 'UEFI Firmware Settings' {
	fwsetup
}
else
menuentry 'Test memory' {
	linux16 /boot/memtest86+x64.bin
}
fi
