
menuentry "Try or Install Hana Remix" {
	set gfxpayload=keep
	linux	/casper/vmlinuz locale=ja_JP.UTF-8 iso-scan/filename=${iso_path} --- quiet splash
	initrd	/casper/initrd
}
menuentry "Hana Remix (safe graphics)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz locale=ja_JP.UTF-8 nomodeset iso-scan/filename=${iso_path} --- quiet splash
	initrd	/casper/initrd
}
